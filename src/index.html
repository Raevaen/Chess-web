<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>My Chess</title>
  <style>body{font-family: monospace;}</style>
</head>
<body>
  <h3>Our Chess (local 2-player)</h3>
  <div>
    <button id="newGameBtn">New Game</button>
    <span id="turnIndicator">Turn: White</span>
  </div>
  <p>Click a piece to select it, then click destination square. Pieces are shown as [WK],[WQ],[WN],[WB],[WR],[Wp] and [BK],... [Bp].</p>

  <table id="board" border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;">
  </table>

<script src="index.js">
</script>
</body>
</html>
